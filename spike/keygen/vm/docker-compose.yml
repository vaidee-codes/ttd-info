# Keygen CE on an always-on VM (Phase 1 spike, option B: Oracle Always Free / any x86 host).
# Usage on the VM:  cp .env.example .env  (fill values)  &&  docker compose up -d
# First boot only:  docker compose run --rm web setup   (non-interactive when KEYGEN_ADMIN_* are set)
name: keygen

x-keygen: &keygen
  image: keygen/api:v1.7.2
  restart: unless-stopped
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    WEB_CONCURRENCY: "0"
    RAILS_MAX_THREADS: "3"
    SIDEKIQ_CONCURRENCY: "5"
  depends_on: [redis]
  mem_limit: 700m

services:
  web:
    <<: *keygen
    command: web
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Host: $$KEYGEN_HOST\" http://127.0.0.1:3000/v1/ping >/dev/null"]
      interval: 30s
      retries: 5

  worker:
    <<: *keygen
    command: worker

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    mem_limit: 160m

  # Public HTTPS without a domain: Cloudflare named tunnel needs a zone, so the spike uses a
  # quick tunnel (random *.trycloudflare.com host). Replace with a named tunnel once a domain exists.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    depends_on: [web]

volumes:
  redis-data:
