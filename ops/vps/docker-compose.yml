# Keygen CE on the Lightsail VPS. Caddy terminates TLS (Let's Encrypt) for KEYGEN_HOST.
# The Sidekiq worker is omitted on purpose: the licensing adapter sets first-activation
# expiry itself and nothing uses Keygen webhooks. Add it back only if that changes.
name: keygen

services:
  web:
    image: keygen/api@sha256:8d60120082255d0edb241718962c205ac2f356bd4d8afcfd823ab4410c402327
    command: web
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "0"
      RAILS_MAX_THREADS: "5"
      PORT: "3000"
    depends_on: [redis]
    mem_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Host: $$KEYGEN_HOST\" http://127.0.0.1:3000/v1/health >/dev/null"]
      interval: 30s
      retries: 5
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    mem_limit: 96m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    environment:
      REHEARSAL_HOST: ${REHEARSAL_HOST:-http://rehearsal.localhost}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [web]
    mem_limit: 96m

  # Migration rehearsal only: a separate Keygen on its own database.
  # docker compose --profile rehearsal up -d rehearsal   (and down when finished)
  rehearsal:
    profiles: [rehearsal]
    image: keygen/api@sha256:8d60120082255d0edb241718962c205ac2f356bd4d8afcfd823ab4410c402327
    command: web
    restart: unless-stopped
    env_file: rehearsal.env
    environment:
      REDIS_URL: redis://redis:6379/1
      WEB_CONCURRENCY: "0"
      RAILS_MAX_THREADS: "5"
      PORT: "3000"
    depends_on: [redis]
    mem_limit: 450m

volumes:
  redis-data:
  caddy-data:
  caddy-config:
