<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find my licence key — TTD Autofill</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/pass/pass.css">
  <style>[hidden]{display:none!important}.fk-key{margin-top:12px}</style>
</head>
<body>
  <main style="max-width:560px;margin:40px auto;padding:0 16px">
    <section class="pass-card">
      <h1 style="margin-top:0">Find my licence key</h1>
      <p class="pass-note">Enter the email you used when paying. We'll send a 6-digit code to it, then show every key bought with that email.</p>

      <div id="step-email">
        <input class="pass-field" id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" style="margin-top:14px">
        <button class="pass-btn" id="send">Email me a code</button>
      </div>

      <div id="step-code" hidden>
        <input class="pass-field" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="margin-top:14px">
        <button class="pass-btn" id="verify">Show my keys</button>
        <p class="pass-note"><a class="pass-link" href="#" id="restart">Use a different email</a></p>
      </div>

      <p class="pass-note" id="info"></p>
      <div class="pass-error" id="error"></div>
      <div id="keys"></div>
      <p class="pass-note">Still stuck? Email <a class="pass-link" href="mailto:ttdautofill@gmail.com">ttdautofill@gmail.com</a> with your payment receipt.</p>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    function showError(text) { $('error').textContent = text || ''; $('error').classList.toggle('show', !!text); }

    async function post(body) {
      const res = await fetch('/api/find-key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Something went wrong. Try again.');
      return data;
    }

    $('send').addEventListener('click', async () => {
      showError('');
      const email = $('email').value.trim();
      if (!$('email').checkValidity() || !email) return showError('Enter a valid email address.');
      $('send').disabled = true;
      try {
        const data = await post({ email });
        $('info').textContent = data.message;
        $('step-email').hidden = true;
        $('step-code').hidden = false;
        $('code').focus();
      } catch (e) { showError(e.message); }
      $('send').disabled = false;
    });

    $('verify').addEventListener('click', async () => {
      showError('');
      $('verify').disabled = true;
      try {
        const data = await post({ email: $('email').value.trim(), code: $('code').value.trim() });
        $('info').textContent = data.keys.length ? 'Your licence keys (newest first):' : 'No keys found for this email.';
        $('keys').replaceChildren(...data.keys.map((k) => {
          const row = document.createElement('div');
          row.className = 'pass-key fk-key';
          const code = document.createElement('code');
          code.textContent = k.license_key;
          const btn = document.createElement('button');
          btn.className = 'pass-btn ghost';
          btn.textContent = 'Copy';
          btn.style.margin = '0';
          btn.addEventListener('click', () => navigator.clipboard.writeText(k.license_key).catch(() => {}));
          const meta = document.createElement('small');
          meta.className = 'pass-note';
          meta.textContent = (k.days ? k.days + '-day pass' : 'Pass') + (k.purchased_at ? ' · ' + new Date(k.purchased_at).toLocaleDateString('en-IN', { dateStyle: 'medium' }) : '');
          row.append(code, btn);
          const wrap = document.createElement('div');
          wrap.append(row, meta);
          return wrap;
        }));
        $('step-code').hidden = true;
      } catch (e) { showError(e.message); }
      $('verify').disabled = false;
    });

    $('restart').addEventListener('click', (e) => {
      e.preventDefault();
      $('step-code').hidden = true; $('step-email').hidden = false; $('keys').replaceChildren(); $('info').textContent = ''; showError('');
    });
  </script>
</body>
</html>
